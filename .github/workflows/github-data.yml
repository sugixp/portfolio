# Refreshes data/github.json once a day (and on demand), commits it only when
# it changed, then rebuilds and deploys the site.
#
# The deploy is called directly because a push made with GITHUB_TOKEN does not
# trigger other workflows. It runs even without new data, so relative dates on
# the status board ("3 days ago") stay correct.
name: GitHub data

on:
  schedule:
    - cron: "17 6 * * *" # 03:17 in Brasília
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Fetch GitHub data
        run: node scripts/fetch-github.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Validate
        run: npm run validate:data

      - name: Commit if changed
        run: |
          if git diff --quiet -- data/github.json; then
            echo "data/github.json unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/github.json
          git commit -m "chore(data): update GitHub activity"
          git push

  deploy:
    needs: update
    uses: ./.github/workflows/deploy.yml
    with:
      ref: main
    permissions:
      contents: read
      pages: write
      id-token: write
